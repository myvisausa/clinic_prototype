name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      walkthrough_release_tag:
        description: Immutable clinical walkthrough release tag to publish
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.10.0"
  AWS_REGION: us-east-1
  SITE_BUCKET: myvisausa-clinic-prototype-dev
  WEBSITE_URL: http://myvisausa-clinic-prototype-dev.s3-website-us-east-1.amazonaws.com
  SITE_HTTPS_URL: https://myvisausa-clinic-prototype-dev.s3.us-east-1.amazonaws.com

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Terraform plan and apply
        uses: austinibele/gh-actions/.github/plan-apply@main
        with:
          terraform_directory: infra
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          aws_region: ${{ env.AWS_REGION }}
          role_to_assume: arn:aws:iam::${{ vars.DEV_AWS_ACCOUNT_ID }}:role/github-ci-clinic-prototype-terraform-dev
          tf_var_env: dev

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.DEV_AWS_ACCOUNT_ID }}:role/github-ci-clinic-prototype-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Next export
        run: npm run build --workspace=web -- --webpack

      - name: Verify staff walkthrough export
        run: |
          set -euo pipefail
          staff_root=apps/web/out/clinical-walkthrough-staff
          test -f "$staff_root/iframe.html"
          test -f "$staff_root/index.json"
          test -f "$staff_root/walkthrough/build.json"
          test -f "$staff_root/walkthrough/staff/index.html"
          test -f "$staff_root/walkthrough/staff/staff-chapters.json"
          test -f "$staff_root/reference/index.html"
          test -f "$staff_root/reference/index-en.html"
          test "$(find "$staff_root/reference/images" -type f | wc -l | tr -d ' ')" = 32

      - name: Build Storybook
        run: npm run build-storybook

      - name: Assemble deploy tree
        run: |
          set -euo pipefail
          mkdir -p deploy/site
          cp -R apps/web/out/. deploy/site/
          mkdir -p deploy/site/storybook
          cp -R packages/ui/storybook-static/. deploy/site/storybook/

      - name: Download and verify clinical walkthrough
        if: inputs.walkthrough_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WALKTHROUGH_RELEASE_TAG: ${{ inputs.walkthrough_release_tag }}
        run: |
          set -euo pipefail
          case "$WALKTHROUGH_RELEASE_TAG" in
            clinical-walkthrough-*) ;;
            *)
              echo "Unexpected walkthrough release tag: $WALKTHROUGH_RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          mkdir -p deploy/walkthrough-download deploy/site/clinical-walkthrough
          gh release download "$WALKTHROUGH_RELEASE_TAG" \
            --pattern clinical-walkthrough.tar.gz \
            --pattern clinical-walkthrough.tar.gz.sha256 \
            --dir deploy/walkthrough-download
          (
            cd deploy/walkthrough-download
            sha256sum --check clinical-walkthrough.tar.gz.sha256
          )
          tar -xzf deploy/walkthrough-download/clinical-walkthrough.tar.gz \
            --directory deploy/site/clinical-walkthrough \
            --no-same-owner
          test -f deploy/site/clinical-walkthrough/iframe.html
          test -f deploy/site/clinical-walkthrough/walkthrough/index.html

      - name: Sync clinical walkthrough to S3
        if: inputs.walkthrough_release_tag != ''
        run: |
          aws s3 sync deploy/site/clinical-walkthrough/ \
            "s3://${SITE_BUCKET}/clinical-walkthrough/" \
            --delete \
            --cache-control "no-cache"

      - name: Sync to S3
        run: |
          aws s3 sync deploy/site/ "s3://${SITE_BUCKET}/" \
            --delete \
            --exclude "clinical-walkthrough/*" \
            --cache-control "no-cache"

      - name: Smoke test
        run: |
          set -euo pipefail
          curl --fail -sS -o /dev/null "${WEBSITE_URL}/"
          curl --fail -sS -o /dev/null "${WEBSITE_URL}/components/"
          curl --fail -sS -o /dev/null "${WEBSITE_URL}/storybook/"
          curl --fail -sS -o /dev/null "${WEBSITE_URL}/storybook/iframe.html"

      - name: Smoke test clinical walkthrough
        if: inputs.walkthrough_release_tag != ''
        run: |
          set -euo pipefail
          curl --fail -sS -o /dev/null "${WEBSITE_URL}/clinical-walkthrough/walkthrough/?lang=es"
          curl --fail -sS -o /dev/null "${WEBSITE_URL}/clinical-walkthrough/walkthrough/?lang=en"
          curl --fail -sS -o /dev/null "${WEBSITE_URL}/clinical-walkthrough/iframe.html"

      - name: Smoke test staff walkthrough
        run: |
          set -euo pipefail
          curl --fail -sS -o /dev/null "${SITE_HTTPS_URL}/clinical-walkthrough-staff/walkthrough/staff/index.html?lang=es"
          curl --fail -sS -o /dev/null "${SITE_HTTPS_URL}/clinical-walkthrough-staff/walkthrough/staff/index.html?lang=en"
          curl --fail -sS -o /dev/null "${SITE_HTTPS_URL}/clinical-walkthrough-staff/walkthrough/staff/staff-chapters.json"
          curl --fail -sS -o /dev/null "${SITE_HTTPS_URL}/clinical-walkthrough-staff/walkthrough/build.json"
          curl --fail -sS -o /dev/null "${SITE_HTTPS_URL}/clinical-walkthrough-staff/iframe.html"
          curl --fail -sS -o /dev/null "${SITE_HTTPS_URL}/clinical-walkthrough-staff/reference/index.html"
          curl --fail -sS -o /dev/null "${SITE_HTTPS_URL}/clinical-walkthrough-staff/reference/index-en.html"

      - name: Summary
        env:
          WALKTHROUGH_RELEASE_TAG: ${{ inputs.walkthrough_release_tag }}
        run: |
          echo "Website: ${WEBSITE_URL}/"
          echo "Storybook: ${WEBSITE_URL}/storybook/"
          if [[ -n "$WALKTHROUGH_RELEASE_TAG" ]]; then
            echo "Clinical walkthrough (ES): ${WEBSITE_URL}/clinical-walkthrough/walkthrough/?lang=es"
            echo "Clinical walkthrough (EN): ${WEBSITE_URL}/clinical-walkthrough/walkthrough/?lang=en"
          fi
          echo "Staff walkthrough (ES): ${SITE_HTTPS_URL}/clinical-walkthrough-staff/walkthrough/staff/index.html?lang=es"
          echo "Staff walkthrough (EN): ${SITE_HTTPS_URL}/clinical-walkthrough-staff/walkthrough/staff/index.html?lang=en"
